<!DOCTYPE html>
<html>
    <head>
	<meta charset="UTF-8">
        <style>
            #openseadragon1{width: 1024px; height: 1024px;}
	    *{color: orange;}
	    *{font-weight: bold;}
	    *{font-family: 'Arial';}
        </style>
        <script src="openseadragon/openseadragon.min.js"></script>
	<script src="OpenSeadragonScalebar-master/openseadragon-scalebar.js"></script>
    </head>
    <body>
        <div id="openseadragon1"></div>
	<div id="Description">ZASADNY et al.<br><br>Description:<br>Stitched global overview of<br>immunolabeled rat myocardium.<br><br>The approximate corners of the<br>32x11 image grid are marked.</div>
	<div id="BOTTOM RIGHT">x-----BOTTOM RIGHT</div>
	<div id="BOTTOM LEFT">x-----BOTTOM LEFT</div>
	<div id="TOP LEFT">x-----TOP LEFT</div>
	<div id="TOP RIGHT">x-----TOP RIGHT</div>
	<script type="text/javascript">
            var viewer = OpenSeadragon({
		id: "openseadragon1",
		prefixUrl: "openseadragon/images/",
		tileSources: ["https://f005.backblazeb2.com/file/large-area-rat-heart-em/TILE_SET_1.dzi"],
		overlays: [{id:'Description', x: 0.18, y: 0.08, placement: 'TOP', checkResize: false},
			   {id:'BOTTOM RIGHT', x: 0.33323, y: 0.7035, placement: 'LEFT', checkResize: false},
			   {id:'BOTTOM LEFT', x: 0.4014, y: 0.7651, placement: 'LEFT', checkResize: false},
			   {id:'TOP LEFT', x: 0.2816, y: 0.8954, placement: 'LEFT', checkResize: false},
			   {id:'TOP RIGHT', x: 0.2134, y: 0.8332, placement: 'LEFT', checkResize: false}]
	    });
	    viewer.scalebar({pixelsPerMeter: 50000000, barThickness: 2, xOffset: 100, yOffset: 75,
			    location: OpenSeadragon.ScalebarLocation.BOTTOM_LEFT, color: "rgb(0,0,255)", fontColor: "rgb(0,0,255)"});
	</script>
    </body>
</html>
